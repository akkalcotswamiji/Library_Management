
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students | Library Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Registered Students</h1>
                <p>Manage your library members</p>
            </div>
        </header>

        <section class="content-section">

            <div class="section-heading">
                <div>
                    <h2>Student Records</h2>
                    <p>Manage and register library members.</p>
                </div>

                <button id="addStudentBtn" class="primary-btn" type="button">
                    + Register Student
                </button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <p>Total Registered Students</p>
                    <h2 id="totalStudents">25</h2>
                </div>
            </div>

            <div class="search-container">
                <input
                    type="text"
                    id="searchStudent"
                    placeholder="Search students by name or email..."
                >
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Registered On</th>
                        </tr>
                    </thead>

                    <tbody id="studentsTable"></tbody>
                </table>
            </div>

        </section>

    </main>

    <div class="modal" id="studentModal">
        <div class="modal-content">

            <div class="modal-header">
                <h2>Register Student</h2>
                <button id="closeModal" type="button">&times;</button>
            </div>

            <form id="studentForm">
                <label>Full Name</label>
                <input type="text" name="name" required>

                <label>Email Address</label>
                <input type="email" name="email" required>

                <label>Phone Number</label>
                <input type="tel" name="phone">

                <label>Password</label>
                <input type="password" name="password" minlength="8" required>

                <button type="submit" class="primary-btn">
                    Register Student
                </button>

                <p id="formMessage"></p>
            </form>

            <p style="font-size:12px; color:var(--muted); margin-top:12px;">
                Public demo: registrations are not saved.
            </p>

        </div>
    </div>

    <script src="students.js"></script>

</body>
</html>
